<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catatan Freelancer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Catatan Freelancer</h1>

    <form id="form" class="form">
      <input id="client" type="text" placeholder="Nama Klien" class="full">
      <input id="project" type="text" placeholder="Proyeknya Apa" class="full">
      <input id="date" type="date" aria-label="Tanggal">
      <select id="status" aria-label="Status">
        <option value="unpaid">Belum dibayar</option>
        <option value="paid">Lunas</option>
      </select>
      <select id="category" aria-label="Kategori">
        <option>Desain</option>
        <option>Pengembangan Web</option>
        <option>Penulisan</option>
        <option>Konsultasi</option>
        <option>Lainnya</option>
      </select>
      <input id="amount" type="number" placeholder="Nominal (Rp)">
      <input id="notes" type="text" placeholder="Catatan (opsional)" class="full">
      <button type="submit" class="full">Simpan tagihan</button>
    </form>

    <div class="filters" id="filters">
      <button data-filter="all">Semua</button>
      <button data-filter="unpaid">Belum dibayar</button>
      <button data-filter="paid">Lunas</button>
    </div>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>Belum ada tagihan. Ayo semangat kerja!</p>

    <button id="clear" class="clear">Hapus semua data</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
